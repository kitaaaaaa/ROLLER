name: Release

# A tagged, non-prerelease build, cut by hand. The nightly next door does the
# same work on a schedule and publishes a dated pre-release; this one takes a
# version, publishes it as the latest release, and reads its notes out of
# docs/release-notes/ when they are there.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v (e.g. 0.2.0). Defaults to build.zig.zon."
        required: false
        type: string
      draft:
        description: "Publish as a draft"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  version:
    name: Get version info
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      full_hash: ${{ steps.version.outputs.full_hash }}
      short_hash: ${{ steps.version.outputs.short_hash }}
      build_date: ${{ steps.version.outputs.build_date }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get version info
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -o '\.version = "[^"]*"' build.zig.zon | cut -d'"' -f2)
          fi
          # Tolerate a leading v on the way in; the tag adds its own.
          VERSION="${VERSION#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$VERSION' is not a three-part version"
            exit 1
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "full_hash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "short_hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      semver_version: ${{ needs.version.outputs.version }}
      git_hash: ${{ needs.version.outputs.full_hash }}
      short_hash: ${{ needs.version.outputs.short_hash }}
      build_date: ${{ needs.version.outputs.build_date }}
      dev_build: false
      # The soak is the nightly's gate, not a release's: it downloads the
      # freeware demo from a third party, which is a bad thing to have
      # standing between a finished build and its release page.
      run_soak: false

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [version, build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p release-assets
          for file in $(find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \)); do
            filename=$(basename "$file")
            if [[ "$filename" == *.tar.gz ]]; then
              base_name=$(basename "$filename" .tar.gz)
              extension=".tar.gz"
            else
              base_name=$(basename "$filename" .zip)
              extension=".zip"
            fi
            cp "$file" "release-assets/${base_name}-${VERSION}${extension}"
          done
          # Named after the artifact folder, since app-release.apk is not.
          for file in $(find artifacts -type f -name "*.apk"); do
            artifact_name=$(basename "$(dirname "$file")")
            cp "$file" "release-assets/${artifact_name}-${VERSION}.apk"
          done
          ls -la release-assets

      - name: Publish release
        env:
          VERSION: ${{ needs.version.outputs.version }}
          FULL_HASH: ${{ needs.version.outputs.full_hash }}
          SHORT_HASH: ${{ needs.version.outputs.short_hash }}
          BUILD_DATE: ${{ needs.version.outputs.build_date }}
          DRAFT: ${{ github.event.inputs.draft }}
        run: |
          RELEASE_TAG="v${VERSION}"
          NOTES_FILE="docs/release-notes/${VERSION}.md"

          if [ -f "$NOTES_FILE" ]; then
            cp "$NOTES_FILE" release_notes.md
            printf '\n\n---\n\n' >> release_notes.md
          else
            : > release_notes.md
          fi

          cat >> release_notes.md << EOF
          **Build Information:**

          - Version: ${VERSION}
          - Commit: ${FULL_HASH}
          - Build Date: ${BUILD_DATE}

          **Platforms:**

          - Linux x86_64
          - Linux ARM64
          - Windows x86_64
          - macOS ARM64
          - macOS x86_64
          - Android (release build, arm64-v8a + x86_64)

          **Note:** The Android APK is a release build signed with the
          auto-generated debug keystore rather than a Play Store key; install it
          with \`adb install -r\`, or enable "install unknown apps" for your file
          manager.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::$RELEASE_TAG already exists"
            exit 1
          fi

          ARGS=""
          if [ "$DRAFT" = "true" ]; then
            ARGS="--draft"
          else
            ARGS="--latest"
          fi

          gh release create "$RELEASE_TAG" \
            --title "ROLLER-X ${VERSION}" \
            --notes-file release_notes.md \
            --target "$(git rev-parse HEAD)" \
            $ARGS \
            release-assets/*
